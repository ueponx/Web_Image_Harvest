<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Page Image Downloader</title>
  <style>
    body {
      width: 250px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3367d6;
    }
    #status {
      margin-top: 10px;
      color: #4285f4;
    }
  </style>
</head>
<body>
  <h2>ページ内画像ダウンローダー</h2>
  
  <button id="downloadBtn">すべての画像をダウンロード</button>
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
